<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Life // Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud-wrap">
    <header class="hud-top">
      <div class="title">STREET LIFE // OPEN CITY</div>
      <div id="clockLabel" class="clock">День 1 • 08:00</div>
    </header>

    <section class="hud-panels">
      <aside class="panel left">
        <h3>Персонаж</h3>
        <div id="profilePanel"></div>
        <div class="sep"></div>
        <h4>Активная задача</h4>
        <div id="missionPanel" class="small"></div>
        <div class="sep"></div>
        <h4>Подсказки</h4>
        <ul class="small">
          <li>WASD — передвижение</li>
          <li>E — взаимодействие с местом</li>
          <li>Shift — бег</li>
          <li>M — скрыть/показать карту</li>
        </ul>
      </aside>

      <main class="game-area">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
      </main>

      <aside class="panel right">
        <h3>Лог событий</h3>
        <div id="logPanel" class="log"></div>
        <div class="sep"></div>
        <h4>Финансы</h4>
        <div id="financePanel" class="small"></div>
        <div class="sep"></div>
        <h4>Связи и репутация</h4>
        <div id="socialPanel" class="small"></div>
      </aside>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
